name: Build MPP Patches

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build .mpp Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure Gradle Properties
        run: |
          mkdir -p ~/.gradle
          echo "gpr.user=${{ secrets.GPR_USER }}" >> ~/.gradle/gradle.properties
          echo "gpr.key=${{ secrets.GPR_KEY }}" >> ~/.gradle/gradle.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build MPP with Gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew buildAndroid --stacktrace

      - name: Upload MPP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: piko-patches-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v3.10.0-build${{ github.run_number }}
          name: Piko Patches v3.10.0 (Build ${{ github.run_number }})
          body: |
            ### Automated MPP Build
            - Instant download button fix for View-Once / QuickSnap messages
            - Stock settings on own profile & long-press for Piko/Alan settings
            - Story mention indicator pill (like HushGram)
          files: patches/build/libs/*.mpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
